name: Build and Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27.2' ]
        os: [linux, windows]
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Dependencies
        run: go mod tidy && sudo apt-get update && sudo apt-get install -y build-essential gcc-mingw-w64 libudev-dev

      - name: Extract tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Binaries
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          unset CC
          SUFFIX=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            CC="x86_64-w64-mingw32-gcc"
            SUFFIX=".exe"
          fi
          mkdir -p dist
          CC="$CC" go build -v -o "dist/litra-ctl-${{ env.TAG_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${SUFFIX}" ./cmd/litra-ctl
          CC="$CC" go build -v -o "dist/litra-homekit-${{ env.TAG_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${SUFFIX}" ./cmd/litra-homekit

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: litra-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Create GitHub Release with Go Binaries
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*/*
